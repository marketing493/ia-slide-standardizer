<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battlecard Library</title>
    <link rel="icon" href="{{ url_for('static', filename='images/ia_logo.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;1,300&family=Inter+Tight:wght@400;500;600&family=Lato:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ia.css') }}">
    <style>
        .hero { padding: 62px 40px 128px; }
        .hero .wrap { max-width: 1160px; margin: 0 auto; }
        .hero .eyebrow { color: rgba(255,255,255,.62); }
        .hero .display { margin-top: 16px; color: var(--white); max-width: 15ch; }
        .hero .lede { margin-top: 20px; color: rgba(255,255,255,.78); max-width: 520px; }

        .counts { display: flex; gap: 46px; margin-top: 38px; }
        .count b { display: block; font-family: var(--serif); font-weight: 200; font-size: 52px; line-height: .95; letter-spacing: -2.4px; }
        .count span { display: block; margin-top: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase; color: rgba(255,255,255,.6); }

        .page { max-width: 1160px; margin: 0 auto; padding: 0 40px 84px; }
        .filters { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: -88px; padding: 16px; position: relative; z-index: 10; }
        .filters .field { flex: 1; min-width: 240px; background: var(--white); }
        .filters select.field { flex: 0 0 210px; min-width: 0; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(336px, 1fr)); gap: 22px; margin-top: 30px; }
        .kard {
            position: relative; overflow: hidden; cursor: pointer; text-align: left;
            background: var(--white); border: 1px solid var(--gray1); border-radius: var(--r);
            box-shadow: var(--lift); padding: 0; font-family: var(--sans);
            display: flex; flex-direction: column;
            transition: transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .16s;
        }
        .kard:hover { transform: translateY(-4px); box-shadow: var(--lift-hi); }
        .kard::before {
            content: ''; position: absolute; inset: 0; z-index: 0; opacity: .38;
            background: linear-gradient(158deg, var(--kc) 0%, rgba(255,255,255,0) 56%);
        }
        .kard > * { position: relative; z-index: 1; }
        .kard .top { height: 4px; background: var(--kc); z-index: 2; position: relative; }
        .kard .in { padding: 20px 22px 22px; flex: 1; display: flex; flex-direction: column; }
        .kard .sol { display: flex; align-items: center; gap: 8px; }
        .kard .sol i { width: 9px; height: 9px; border-radius: 3px; background: var(--kc); flex: none; }
        .kard .sol span { font-size: 10.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #4a4a4a; }
        .kard h3 { font-family: var(--serif); font-weight: 300; font-size: 27px; line-height: 1.1; letter-spacing: -.9px; margin: 12px 0 0; }
        .kard .say { font-size: 14px; color: #5f5f5f; margin-top: 10px; line-height: 1.5; flex: 1; }
        .kard .meta { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--gray1); }
        .kard .ago { margin-left: auto; font-family: var(--mono-ish); font-size: 11.5px; color: var(--gray3); }

        .void { margin-top: 30px; background: var(--white); border: 1px dashed var(--gray2); border-radius: var(--r); padding: 64px 34px; text-align: center; }
        .void .h2 { color: var(--black); }
        .void p { color: var(--gray3); margin-top: 10px; font-size: 16px; max-width: 46ch; margin-left: auto; margin-right: auto; }
        .void .btn { margin-top: 24px; }

        /* ── Detail drawer ───────────────────────────────────────────────── */
        .scrim { position: fixed; inset: 0; background: rgba(20,41,122,.42); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 50; }
        .scrim.on { opacity: 1; pointer-events: auto; }
        .sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(700px, 100%); background: var(--off-white); z-index: 60; transform: translateX(100%); transition: transform .24s cubic-bezier(.2,.7,.3,1); display: flex; flex-direction: column; }
        .sheet.on { transform: none; }
        .sheet .cap { position: relative; overflow: hidden; flex: none; padding: 26px 30px 22px; color: var(--white); background: var(--impact-blue); }
        .sheet .cap h2 { font-family: var(--serif); font-weight: 300; font-size: 33px; letter-spacing: -1.2px; line-height: 1.08; position: relative; z-index: 2; }
        .sheet .cap .bits { position: relative; z-index: 2; margin-top: 8px; font-size: 12.5px; color: rgba(255,255,255,.72); font-family: var(--mono-ish); }
        .sheet .cap .shut { position: absolute; top: 22px; right: 26px; z-index: 3; border: none; background: rgba(255,255,255,.16); color: #fff; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px; }
        .sheet .cap .shut:hover { background: rgba(255,255,255,.28); }
        .sheet .scroll { overflow-y: auto; padding: 24px 30px 44px; }
        .blk { background: var(--white); border: 1px solid var(--gray1); border-radius: var(--r); padding: 19px 21px; margin-bottom: 16px; }
        .blk > .eyebrow { color: var(--impact-blue); display: block; margin-bottom: 12px; }
        .blk p, .blk li { font-size: 14.5px; line-height: 1.6; }
        .blk ul { margin: 0 0 0 18px; }
        .blk li { margin-bottom: 7px; }
        .first-say { position: relative; overflow: hidden; background: var(--impact-blue); color: #fff; border-radius: var(--r); padding: 22px 24px; margin-bottom: 16px; }
        .first-say .eyebrow { color: rgba(255,255,255,.66); display: block; margin-bottom: 9px; position: relative; z-index: 2; }
        .first-say p { font-family: var(--serif); font-weight: 300; font-size: 19.5px; line-height: 1.42; position: relative; z-index: 2; }

        table.mx { width: 100%; border-collapse: collapse; font-size: 13.5px; }
        table.mx th { text-align: left; font-size: 10px; letter-spacing: .9px; text-transform: uppercase; color: var(--gray3); font-weight: 600; padding: 0 8px 9px 0; }
        table.mx td { padding: 9px 8px 9px 0; border-top: 1px solid var(--gray1); vertical-align: top; }
        table.mx td.cap0 { font-weight: 500; }
        .rate { font-weight: 600; font-size: 12px; white-space: nowrap; }
        .rate.strong { color: var(--impact-blue); }
        .rate.partial { color: var(--black); }
        .rate.none { color: var(--orange); }
        .rate.unknown { color: var(--gray3); }

        .sheet .foot { flex: none; background: var(--white); border-top: 1px solid var(--gray1); padding: 16px 30px; display: flex; gap: 11px; align-items: center; }
        .sheet .foot .push { margin-left: auto; }

        @media (max-width: 760px) {
            .hero { padding: 40px 22px 112px; }
            .page { padding: 0 22px 60px; }
            .counts { gap: 26px; }
            .count b { font-size: 38px; }
            .sheet .cap, .sheet .scroll, .sheet .foot { padding-left: 20px; padding-right: 20px; }
        }
    </style>
</head>
<body>
<header class="masthead">
    <div class="mark">
        <img src="{{ url_for('static', filename='images/ia_logo.png') }}" alt="Impact Analytics">
        <b>Battlecard Builder</b>
    </div>
    <nav>
        <a href="{{ url_for('index') }}">Build</a>
        <a href="{{ url_for('library_page') }}" class="here">Library</a>
        <a href="{{ url_for('intel_page') }}">Teach</a>
        <a href="{{ url_for('database_page') }}"><span class="long">Existing Intelligence </span>Database</a>
    </nav>
</header>

<section class="hero blue-field grid-lines has-grain">
    <div class="wrap">
        <p class="eyebrow">Shared library</p>
        <h1 class="display">Every card the team has <em>built</em>.</h1>
        <p class="lede">Borrow a talk track. Check what a colleague already researched.
           Rebuild any deck at the length you need, without spending a second run.</p>
        <div class="counts" id="counts"></div>
    </div>
</section>

<div class="page">
    <div class="filters glass">
        <label class="sr-only" for="q">Search</label>
        <input class="field" type="search" id="q" placeholder="Search a competitor, a headline or a win theme">
        <label class="sr-only" for="product">Product</label>
        <select class="field" id="product"><option value="">Every product</option></select>
        <button class="btn btn-ghost btn-sm" id="clearBtn">Clear</button>
        <a class="btn btn-primary btn-sm" href="{{ url_for('index') }}">Build a new card</a>
    </div>
    <div id="results"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-hidden="true">
    <div class="cap blue-field grid-lines has-grain">
        <button class="shut" id="shut" title="Close">&#10005;</button>
        <h2 id="sTitle"></h2>
        <div class="bits" id="sBits"></div>
    </div>
    <div class="scroll" id="sBody"></div>
    <div class="foot">
        <label class="sr-only" for="sDepth">Rebuild length</label>
        <select class="field" id="sDepth" style="flex:0 0 210px;padding:11px 13px;font-size:14px">
            <option value="">Same length as saved</option>
            <option value="summary">Rebuild as Summary</option>
            <option value="standard">Rebuild as Standard</option>
            <option value="technical">Rebuild as Full technical</option>
            <option value="matrix">Head to head only</option>
        </select>
        <button class="btn btn-primary btn-sm" id="sBuild">Download PPTX</button>
        <button class="btn btn-ghost btn-sm push" id="sDel">Remove</button>
    </div>
</aside>

<script>
const LIBRARY_ENABLED = {{ 'true' if library_enabled else 'false' }};
const ACCENT = {
    inventory_replenishment: '#E3F576', merchandising: '#BEA8EF',
    pricing_promotions: '#3DD499', data_intelligence: '#BFD1F5'
};
const SOL = {
    inventory_replenishment: 'Inventory & Replenishment', merchandising: 'Merchandising',
    pricing_promotions: 'Pricing & Promotions', data_intelligence: 'Data & Intelligence'
};
const RATE = { strong: 'Strong', partial: 'Partial', none: 'Gap', unknown: 'Unclear' };
const LEN = { summary: 'Summary', standard: 'Standard', technical: 'Full technical',
              matrix: 'Head to head' };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let live = null, timer = null;

function ago(iso) {
    if (!iso) return '';
    const days = Math.floor((Date.now() - new Date(iso)) / 86400000);
    if (days <= 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 30) return days + ' days ago';
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
}

async function load() {
    if (!LIBRARY_ENABLED) {
        $('counts').innerHTML = '';
        $('results').innerHTML = `<div class="void"><span class="h2">The library is not connected</span>
            <p>This deployment has no database attached, so cards are not being shared yet.
            Add a Render Postgres instance and set DATABASE_URL. Every card generated after
            that lands here on its own.</p>
            <a class="btn btn-primary" href="/">Build a card anyway</a></div>`;
        return;
    }
    const params = new URLSearchParams();
    if ($('q').value.trim()) params.set('q', $('q').value.trim());
    if ($('product').value) params.set('product', $('product').value);
    const data = await fetch('/api/library?' + params).then(r => r.json());
    const s = data.stats || {};
    $('counts').innerHTML = [[s.cards || 0, 'cards'], [s.competitors || 0, 'competitors'],
                             [s.products || 0, 'IA products']]
        .map(([n, l]) => `<div class="count"><b>${n}</b><span>${l}</span></div>`).join('');
    if ($('product').options.length === 1) {
        $('product').innerHTML += (data.products || [])
            .map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
    }
    paint(data.cards || []);
}

function paint(cards) {
    if (!cards.length) {
        const filtered = $('q').value.trim() || $('product').value;
        $('results').innerHTML = `<div class="void">
            <span class="h2">${filtered ? 'Nothing matches that' : 'The library is empty'}</span>
            <p>${filtered ? 'Try a different competitor, or clear the filters.'
                : 'Generate the first battlecard and it appears here for everyone on the team.'}</p>
            <a class="btn btn-primary" href="/">Build a card</a></div>`;
        return;
    }
    $('results').innerHTML = '<div class="grid">' + cards.map(c => {
        const kc = ACCENT[c.solution] || ACCENT.data_intelligence;
        const bits = [`<span class="pill pill-blue">${esc(c.ia_product || 'Portfolio')}</span>`,
                      `<span class="pill">${c.slide_count} slides</span>`];
        if (c.depth) bits.push(`<span class="pill">${esc(LEN[c.depth] || c.depth)}</span>`);
        if (c.curated) bits.push('<span class="pill pill-good">Hand researched</span>');
        if (c.unverified) bits.push(`<span class="pill pill-warn">${c.unverified} unverified</span>`);
        return `<article class="kard" data-id="${c.id}" style="--kc:${kc}">
            <div class="top"></div>
            <div class="in">
                <div class="sol"><i></i><span>${esc(SOL[c.solution] || 'Battlecard')}</span></div>
                <h3>${esc(c.competitor)}</h3>
                <p class="say">${esc(c.headline || c.win_theme || 'No headline yet.')}</p>
                <div class="meta">${bits.join('')}<span class="ago">${ago(c.created_at)}</span></div>
            </div></article>`;
    }).join('') + '</div>';
    $('results').querySelectorAll('.kard').forEach(el => el.onclick = () => open(el.dataset.id));
}

async function open(id) {
    const data = await fetch('/api/library/' + id).then(r => r.json());
    if (data.error) return;
    live = data;
    const card = data.card || {}, meta = card.meta || {};
    $('sTitle').textContent = data.competitor;
    $('sBits').textContent = [meta.ia_product || 'Portfolio', LEN[data.depth] || data.depth,
        data.slide_count + ' slides', data.author ? 'by ' + data.author : '', ago(data.created_at),
        data.views + (data.views === 1 ? ' view' : ' views')].filter(Boolean).join('   ·   ');

    let html = '';
    const t = card.talk_track || {};
    if (t.positioning) html += `<div class="first-say blue-field grid-lines has-grain">
        <span class="eyebrow">Say this first</span><p>${esc(t.positioning)}</p></div>`;
    if (meta.win_theme) html += blk('Win theme', `<p>${esc(meta.win_theme)}</p>`);
    if ((card.positioning || {}).wedge) html += blk('The wedge', `<p>${esc(card.positioning.wedge)}</p>`);
    if ((card.our_advantages || []).length) html += blk('Why we win', '<ul>' +
        card.our_advantages.map(a => `<li><b>${esc(a.title)}</b>. ${esc(a.detail)}</li>`).join('') + '</ul>');
    if ((card.their_strengths || []).length) html += blk('Where they win', '<ul>' +
        card.their_strengths.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>');
    if ((card.comparison || []).length) html += blk('Head to head', `<table class="mx">
        <tr><th>Capability</th><th>IA</th><th>${esc(data.competitor)}</th></tr>
        ${card.comparison.map(r => `<tr><td class="cap0">${esc(r.capability)}</td>
          <td><span class="rate ${esc(r.ia)}">${esc(RATE[r.ia] || r.ia)}</span></td>
          <td><span class="rate ${esc(r.competitor)}">${esc(RATE[r.competitor] || r.competitor)}</span></td>
        </tr>`).join('')}</table>`);
    if ((card.objections || []).length) html += blk('Objection handling', '<ul>' +
        card.objections.map(o => `<li><b>They say:</b> ${esc(o.objection)}<br><b>We say:</b> ${esc(o.response)}</li>`).join('') + '</ul>');
    if ((card.proof_points || []).length) html += blk('Proof points', '<ul>' +
        card.proof_points.map(p => `<li><b>${esc(p.stat)}</b> ${esc(p.label)}${p.source ? ' · <span style="color:var(--gray3)">' + esc(p.source) + '</span>' : ''}</li>`).join('') + '</ul>');
    $('sBody').innerHTML = html || blk('Nothing yet', '<p>This card has no content.</p>');
    $('sBody').scrollTop = 0;
    $('sDepth').value = '';
    $('sheet').classList.add('on'); $('sheet').setAttribute('aria-hidden', 'false');
    $('scrim').classList.add('on');
}

const blk = (title, inner) => `<div class="blk"><span class="eyebrow">${esc(title)}</span>${inner}</div>`;

function shut() {
    $('sheet').classList.remove('on'); $('sheet').setAttribute('aria-hidden', 'true');
    $('scrim').classList.remove('on'); live = null;
}
$('shut').onclick = shut;
$('scrim').onclick = shut;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && live) shut(); });

$('sBuild').onclick = async () => {
    if (!live) return;
    const btn = $('sBuild'), label = btn.textContent;
    btn.disabled = true; btn.innerHTML = '<span class="spin">&#9696;</span> Building';
    try {
        const data = await fetch('/api/library/' + live.id + '/build', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ depth: $('sDepth').value || undefined })
        }).then(r => r.json());
        if (data.download_url) window.location = data.download_url;
    } finally { btn.disabled = false; btn.textContent = label; }
};

$('sDel').onclick = async () => {
    if (!live || !confirm('Remove the ' + live.competitor + ' card from the shared library?')) return;
    await fetch('/api/library/' + live.id, { method: 'DELETE' });
    shut(); load();
};

$('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 220); });
$('product').onchange = load;
$('clearBtn').onclick = () => { $('q').value = ''; $('product').value = ''; load(); };
load();
</script>
</body>
</html>
