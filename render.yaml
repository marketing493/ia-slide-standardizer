services:
  - type: web
    name: ia-slide-standardizer
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      # Set both in the Render dashboard to gate the app. Without them every
      # route is open, which is unsafe for a deck holding competitive content.
      - key: IA_AUTH_USER
        sync: false
      - key: IA_AUTH_PASSWORD
        sync: false
      # Required for competitor research and the in-app assistant. Without it the
      # builder still assembles saved cards, but nothing is generated.
      - key: ANTHROPIC_API_KEY
        sync: false
      # The Neon connection string, pasted in the dashboard. It holds the shared
      # library, every taught claim and the Existing Intelligence Database, so a
      # new service pointed at the same string has all of it from the first boot.
      # Deliberately not a Render database: a blueprint would create an empty one
      # and wire the app to it, and Render's free databases expire.
      - key: DATABASE_URL
        sync: false
